name: Build systemd images

on:
  schedule:
    # Sundays at 05:37 UTC: upstream rebuilds have usually propagated to Docker
    # Hub by then, and GitHub Actions is at its lowest global load.
    - cron: "37 5 * * 0"
  workflow_dispatch:
    inputs:
      force_build:
        description: Build every target even if its upstream digest is unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-and-publish:
    name: ${{ matrix.distro }} ${{ matrix.upstream_tag }}
    # GitHub's runner label has no point-release suffix; this image is Ubuntu
    # 26.04.1 LTS.
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      # Target tag lists live beside the renderer mapping so the workflow and
      # local renders use one source of truth.
      matrix:
        include:
          - distro: ubuntu
            upstream_repo: library/ubuntu
            upstream_tag: resolute
            target_image: quanvm0501alt1/ubuntu-systemd
            push_to_hub: true
          - distro: ubuntu
            upstream_repo: library/ubuntu
            upstream_tag: noble
            target_image: quanvm0501alt1/ubuntu-systemd
            push_to_hub: true
          - distro: ubuntu
            upstream_repo: library/ubuntu
            upstream_tag: jammy
            target_image: quanvm0501alt1/ubuntu-systemd
            push_to_hub: true
          - distro: ubuntu
            upstream_repo: library/ubuntu
            upstream_tag: stonking
            target_image: quanvm0501alt1/ubuntu-systemd
            push_to_hub: true
          - distro: debian
            upstream_repo: library/debian
            upstream_tag: trixie
            target_image: quanvm0501alt1/debian-systemd
            push_to_hub: true
          - distro: debian
            upstream_repo: library/debian
            upstream_tag: bookworm
            target_image: quanvm0501alt1/debian-systemd
            push_to_hub: true
          - distro: fedora
            upstream_repo: library/fedora
            upstream_tag: "44"
            target_image: quanvm0501alt1/fedora-systemd
            push_to_hub: true
          - distro: fedora
            upstream_repo: library/fedora
            upstream_tag: "43"
            target_image: quanvm0501alt1/fedora-systemd
            push_to_hub: true
          - distro: fedora
            upstream_repo: library/fedora
            upstream_tag: "45"
            target_image: quanvm0501alt1/fedora-systemd
            push_to_hub: true
          - distro: opensuse
            upstream_repo: opensuse/leap
            upstream_tag: latest
            target_image: "<DOCKERHUB_USERNAME>/opensuse-systemd"
            push_to_hub: false

    # Matrix entries may run in parallel, but two runs for the same target must
    # never publish or upload over each other.
    concurrency:
      group: systemd-${{ matrix.distro }}-${{ matrix.upstream_tag }}
      cancel-in-progress: false

    env:
      LOCAL_IMAGE: local/test-image:${{ matrix.distro }}-${{ matrix.upstream_tag }}
      TARBALL: ${{ matrix.distro }}-${{ matrix.upstream_tag }}.tar
      STAGING_IMAGE: ${{ matrix.distro }}-systemd

    steps:
      # The runner cannot download remote actions, so every step below uses
      # plain shell instead of `uses:`.
      - name: Check out repository
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_WORKSPACE}"

      - name: Require python3
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "error: python3 is not installed on this runner" >&2
            exit 1
          fi
          python3 --version

      # The runner image may ship Docker or Podman (or both). Pick one CLI and
      # use it consistently for the build, test, tag, and save steps below.
      - name: Detect container CLI
        id: cli
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "command=docker" >> "$GITHUB_OUTPUT"
          elif command -v podman >/dev/null 2>&1; then
            echo "command=podman" >> "$GITHUB_OUTPUT"
          else
            echo "error: neither docker nor podman is installed" >&2
            exit 1
          fi

      - name: Check upstream digest and render Dockerfile
        id: check
        env:
          # Keep digest state in $HOME: the checkout directory is cleaned after
          # every job, so actions/cache cannot be used either.
          DIGEST_STATE_DIR: "${HOME}/.cache/systemd-image-digests"
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
          DISTRO: ${{ matrix.distro }}
          UPSTREAM_REPO: ${{ matrix.upstream_repo }}
          UPSTREAM_TAG: ${{ matrix.upstream_tag }}
          TARGET_IMAGE: ${{ matrix.target_image }}
        run: |
          args=(
            --distro "${DISTRO}"
            --upstream-repo "${UPSTREAM_REPO}"
            --upstream-tag "${UPSTREAM_TAG}"
            --target-image "${TARGET_IMAGE}"
            --output-env "${GITHUB_OUTPUT}"
          )
          if [[ "${FORCE_BUILD}" == "true" ]]; then
            args+=(--force)
          fi
          python3 scripts/check_and_render.py "${args[@]}"

      # Buildx is a Docker-only feature; keep the build simple with the classic
      # builder so the same command shape works for both CLIs.
      - name: Build image locally
        if: steps.check.outputs.should_build == 'true'
        env:
          CONTAINER_CLI: ${{ steps.cli.outputs.command }}
        run: |
          if [[ "${CONTAINER_CLI}" == "docker" ]]; then
            docker build \
              --pull \
              --file Dockerfile \
              --tag "${LOCAL_IMAGE}" \
              .
          else
            podman build \
              --pull \
              --file Dockerfile \
              --tag "${LOCAL_IMAGE}" \
              .
          fi

      - name: Run systemd integration test
        if: steps.check.outputs.should_build == 'true'
        env:
          CONTAINER_CLI: ${{ steps.cli.outputs.command }}
        run: CONTAINER_CLI="${CONTAINER_CLI}" bash tests/test_container.sh "${LOCAL_IMAGE}"

      - name: Log in to Docker Hub
        if: steps.check.outputs.should_build == 'true' && matrix.push_to_hub
        env:
          CONTAINER_CLI: ${{ steps.cli.outputs.command }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "${DOCKERHUB_TOKEN}" | "${CONTAINER_CLI}" login docker.io \
            --username "${DOCKERHUB_USERNAME}" \
            --password-stdin

      - name: Push active Hub tags
        if: steps.check.outputs.should_build == 'true' && matrix.push_to_hub
        env:
          CONTAINER_CLI: ${{ steps.cli.outputs.command }}
          TARGET_IMAGE: ${{ matrix.target_image }}
          TARGET_TAGS: ${{ steps.check.outputs.target_tags }}
        run: |
          IFS=',' read -ra target_tags <<< "${TARGET_TAGS}"
          for target_tag in "${target_tags[@]}"; do
            "${CONTAINER_CLI}" tag "${LOCAL_IMAGE}" "${TARGET_IMAGE}:${target_tag}"
            echo "Pushing ${TARGET_IMAGE}:${target_tag}"
            "${CONTAINER_CLI}" push "${TARGET_IMAGE}:${target_tag}"
          done

      - name: Save staging image tarball
        if: steps.check.outputs.should_build == 'true' && !matrix.push_to_hub
        env:
          CONTAINER_CLI: ${{ steps.cli.outputs.command }}
          # The runner cannot download remote actions, so actions/upload-artifact
          # is unavailable. Keep the tarball on the runner under $HOME instead;
          # the staging directory persists across runs alongside the digest
          # state and is cleaned by the retention step below.
          STAGING_DIR: "${HOME}/.cache/systemd-image-staging"
          TARGET_TAGS: ${{ steps.check.outputs.target_tags }}
        run: |
          mkdir -p "${STAGING_DIR}"
          IFS=',' read -ra target_tags <<< "${TARGET_TAGS}"
          image_refs=()
          for target_tag in "${target_tags[@]}"; do
            image_ref="${STAGING_IMAGE}:${target_tag}"
            "${CONTAINER_CLI}" tag "${LOCAL_IMAGE}" "${image_ref}"
            image_refs+=("${image_ref}")
          done
          "${CONTAINER_CLI}" save --output "${STAGING_DIR}/${TARBALL}" "${image_refs[@]}"
          # Drop tarballs older than 7 days so the staging directory cannot
          # grow without bound on a long-lived runner.
          find "${STAGING_DIR}" -name '*.tar' -mtime +7 -delete
          ls -lh "${STAGING_DIR}/${TARBALL}"

      # The digest file was written before the build, but it lives in $HOME and
      # persists on the runner, so a failed target would cause later runs to
      # skip a needed rebuild. Rewind it unless the image passed tests and all
      # tags or artifacts are complete.
      - name: Rewind digest on failure
        if: failure() && steps.check.outputs.should_build == 'true'
        env:
          DIGEST_STATE_DIR: "${HOME}/.cache/systemd-image-digests"
          DISTRO: ${{ matrix.distro }}
          UPSTREAM_TAG: ${{ matrix.upstream_tag }}
        run: |
          state_file="${DIGEST_STATE_DIR}/${DISTRO}_${UPSTREAM_TAG}.txt"
          # The digest was rotated by the check step before the build; delete
          # the entry on failure so the next run rebuilds.
          rm -f -- "${state_file}"

      # GitHub-hosted runners are discarded after the job, but self-hosted
      # Docker/Podman runners can accumulate many GB across ten targets. Clean
      # the local stores after the upload/push steps, even on failure.
      - name: Clean Docker and Podman image storage
        if: always()
        continue-on-error: true
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "Cleaning Docker image and build cache storage"
            docker image prune --all --force || true
            if docker buildx version >/dev/null 2>&1; then
              docker buildx prune --all --force || true
            fi
          fi

          if command -v podman >/dev/null 2>&1; then
            echo "Cleaning Podman image storage"
            podman image prune --all --force || true
          fi

      # Delete this job's workspace checkout last. This is primarily useful for
      # self-hosted runners, where checkouts and temporary files otherwise
      # accumulate between jobs; GitHub-hosted runners are discarded anyway.
      #
      # Only the checkout directory (RUNNER_WORKSPACE/GITHUB_WORKSPACE) is
      # removed. The parent _work root must NEVER be deleted: it contains
      # _actions, the runner's cache of downloaded actions (actions/checkout,
      # actions/setup-python, ...). Removing it makes every subsequent job fail
      # with "Can't find 'action.yml', 'action.yaml' or 'Dockerfile' under
      # /home/runner/work/_actions/...".
      - name: Clean up runner workspace directory
        if: always()
        continue-on-error: true
        run: |
          if [[ -z "${RUNNER_WORKSPACE}" || -z "${GITHUB_WORKSPACE}" ]]; then
            echo "Refusing to delete an unknown workspace root"
            exit 0
          fi
          if [[ "${GITHUB_WORKSPACE}" != "${RUNNER_WORKSPACE}"* ]]; then
            echo "Refusing to delete ${RUNNER_WORKSPACE}: GITHUB_WORKSPACE is not inside it"
            exit 0
          fi
          case "${RUNNER_WORKSPACE}" in
            "/"|""|"."|..*)
              echo "Refusing to delete unsafe workspace root: '${RUNNER_WORKSPACE}'"
              exit 0
              ;;
            *"_actions"*)
              echo "Refusing to delete the actions cache: '${RUNNER_WORKSPACE}'"
              exit 0
              ;;
          esac

          cd /
          echo "Deleting runner workspace directory ${RUNNER_WORKSPACE}"
          rm -rf -- "${RUNNER_WORKSPACE}"
